- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-flash
                inputModalities: [text, image]
                contextWindow: 1000000

- id: image-offload
  config:
    toolImageMaxAgeSteps: 1
